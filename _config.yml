title: "RUBBERNAUT: The Thalia Journals"
description: "An Epistolary Tale of Deep Rubber Fetishism in the Winter of Life"
author: AtaraxiA
rncom_version: "v03.27"
url: "https://rubbernaut.com"
baseurl: "/RubberNaut"
timezone: UTC

# docs/ holds repo records (e.g. the @26.1124 build letter), not website pages
exclude:
  - "docs/"

collections:
  journal:
    output: true

defaults:
  - scope:
      path: "_journal"
    values:
      layout: post
