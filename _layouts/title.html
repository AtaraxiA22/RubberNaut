<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"/>
</head>
<body class="titlepage">
<main class="title-main">
  <img class="logo" src="{{ '/assets/img/logo.webp' | relative_url }}" alt="RUBBERNAUT logo"/>
  <h1 class="site-title">{{ site.title }}</h1>
  <p class="subtitle">{{ site.description }}</p>
  <p class="byline">By {{ site.author }}</p>
  <p class="enter"><a class="biglink" href="{{ '/toc.html' | relative_url }}">Table of Contents</a></p>
  <p class="copyright">&copy; <span id="cy">2026</span> by AtaraxiA &mdash; all rights reserved</p>
</main>
<script>/* © year = real-world year at render time (rolls to 2027 on Jan 1 automatically) */
document.getElementById('cy').textContent = new Date().getFullYear();</script>
<footer class="foot"><a class="ver" href="{{ '/contact.html' | relative_url }}">Contact Author</a><span class="hint">Try your arrow keys.</span></footer>
<span class="ver-hidden" title="site version">{{ site.rncom_version }}</span>
</body>
</html>
