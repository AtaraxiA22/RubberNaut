---
layout: default
---
<article class="post" data-storydate="{{ page.storydate }}">
  <p class="toclink"><a href="{{ '/toc.html' | relative_url }}">[Table of contents]</a></p>
  <h1>{{ page.storydate }} &ndash; {{ page.title }}</h1>
  <p class="meta">posted {{ page.postdate }} UTC</p>
  {% if page.image %}
  <p class="postimg"><img src="{{ page.image | relative_url }}" alt="{{ page.title }}"/></p>
  {% endif %}
  <div class="body">{{ content }}</div>
  <p class="toclink"><a href="{{ '/toc.html' | relative_url }}">[Table of contents]</a></p>
</article>
<script>
(function () {
  var art = document.querySelector('article.post');
  var sd = art ? art.getAttribute('data-storydate') : '';
  function setCookie(name, value) {
    document.cookie = name + '=' + encodeURIComponent(value) + ';path=/;max-age=31536000';
  }
  function getCookie(name) {
    var m = new RegExp('(?:^|;\\s*)' + name + '=([^;]*)').exec(document.cookie);
    return m ? decodeURIComponent(m[1]) : '';
  }
  if (sd) {
    setCookie('rncom_last', sd);
    var save = function () { setCookie('rncom_pos', sd + ':' + (window.scrollY || 0)); };
    var t = null;
    window.addEventListener('scroll', function () {
      if (t) return;
      t = setTimeout(function () { save(); t = null; }, 400);
    });
    save();
    var p = getCookie('rncom_pos').split(':');
    if (p[0] === sd && p[1] && !location.hash) {
      window.addEventListener('load', function () { window.scrollTo(0, parseInt(p[1], 10) || 0); });
    }
  }
})();
</script>
