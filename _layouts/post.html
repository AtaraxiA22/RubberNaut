---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%Y-%m-%d %H:%M" }} &mdash; {{ page.stamp }}</p>
  {% if page.image %}
  <p><img src="{{ page.image | relative_url }}" alt="{{ page.title }}"/></p>
  {% endif %}
  <div class="body">{{ content }}</div>
  <hr/>
  <p class="foot">&copy; {{ site.time | date: "%Y" }} by AtaraxiA under Creative Commons BY-SA &mdash; <a href="{{ '/' | relative_url }}">journal index</a></p>
</article>
