---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{% if page.title %}{{ page.title }} &mdash; {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"/>
</head>
<body>
{% unless page.layout == 'title' %}
<header class="banner">
  <a class="banner-home" href="{{ '/' | relative_url }}">
    <img class="banner-logo" src="{{ '/assets/img/logo.webp' | relative_url }}" alt="RUBBERNAUT logo"/>
    <span class="banner-title">{{ site.title }}</span>
  </a>
</header>
{% endunless %}
<main class="page">
{{ content }}
</main>
<footer class="foot"><span class="ver">RNcom.{{ site.rncom_version }}</span></footer>
</body>
</html>
